<script>
// --- PERMANENT TELEGRAM USER & BOT PERSISTENCE ENGINE ---
(function initPermanentTelegramSession() {
  let userId = 'default_user';
  let userName = 'Пользователь';
  
  // 1. Detect Telegram WebApp user
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      userId = user.id ? 'tg_' + user.id : (user.username || 'tg_user');
      userName = user.username ? '@' + user.username : (user.first_name || 'Пользователь');
    }
  }
  
  // 2. Fallback to URL parameters or localStorage
  const urlParams = new URLSearchParams(window.location.search);
  const loginParam = urlParams.get('login');
  if (loginParam) {
    userName = loginParam.startsWith('@') ? loginParam : '@' + loginParam;
    userId = 'user_' + loginParam.replace(/[^a-zA-Z0-9_]/g, '');
    localStorage.setItem('majorka_active_user_id', userId);
    localStorage.setItem('majorka_active_user_name', userName);
  } else {
    const savedId = localStorage.getItem('majorka_active_user_id');
    const savedName = localStorage.getItem('majorka_active_user_name');
    if (savedId) userId = savedId;
    if (savedName) userName = savedName;
  }
  
  // 3. Set global USER context
  window.CURRENT_USER_ID = userId;
  window.CURRENT_USER_NAME = userName;
  
  // 4. Load permanent user-bound bots from localStorage
  const storageKey = 'majorka_bots_' + userId;
  const legacyBots = localStorage.getItem('majorka_bots_demo');
  let userBots = [];
  
  try {
    const stored = localStorage.getItem(storageKey);
    if (stored) {
      userBots = JSON.parse(stored);
    } else if (legacyBots) {
      userBots = JSON.parse(legacyBots);
      localStorage.setItem(storageKey, JSON.stringify(userBots));
    }
  } catch(e) {}
  
  window.BOTS = userBots;
  
  // Override save state function to save permanently under current user ID
  window.saveBotsState = function() {
    try {
      localStorage.setItem('majorka_bots_' + window.CURRENT_USER_ID, JSON.stringify(window.BOTS));
      localStorage.setItem('majorka_bots_demo', JSON.stringify(window.BOTS));
    } catch(e) {}
  };
})();

// Update deleteBot to use permanent save state
function deleteBot(botId) {
  if (confirm('Вы действительно хотите удалить этого бота?')) {
    window.BOTS = window.BOTS.filter(b => b.id !== botId);
    if (window.saveBotsState) window.saveBotsState();
    renderBots();
    renderSidebar();
    renderOverview();
    alert('Бот полностью удалён!');
  }
}
</script>


<script>
// GLOBAL DASHBOARD ENGINE
window.USER_BALANCE = parseInt(localStorage.getItem('majorka_user_balance') || '0');

function updateBalanceUI() {
  const elBal = document.getElementById('uBalanceDisplay');
  if (elBal) {
    elBal.innerHTML = `💰 БАЛАНС: <strong style="color:#c9a84c;font-size:14px">${window.USER_BALANCE.toLocaleString('ru-RU')} ₽</strong>`;
  }
}

window.openOrder = function() {
  const modal = document.getElementById('obg');
  if (modal) {
    modal.style.display = 'flex';
    modal.classList.add('on');
  }
};

window.closeOrder = function() {
  const modal = document.getElementById('obg');
  if (modal) {
    modal.style.display = 'none';
    modal.classList.remove('on');
  }
};

window.confirmTopup = function() {
  window.USER_BALANCE += 6490;
  localStorage.setItem('majorka_user_balance', window.USER_BALANCE);
  updateBalanceUI();
  window.closeOrder();
  alert('🎉 Баланс пополнен на 6 490 ₽! Теперь вы можете запустить бота.');
};

window.addEventListener('DOMContentLoaded', () => {
  updateBalanceUI();
  
  // Auto-topup if return from successful payment URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('paid') === 'true' || params.get('topup')) {
    window.USER_BALANCE += 6490;
    localStorage.setItem('majorka_user_balance', window.USER_BALANCE);
    updateBalanceUI();
  }
});
</script>

}

function renderSbBots(){
  const el = document.getElementById('sbBotList');
  if(!BOTS.length){ el.innerHTML='<div style="padding:10px 24px;font-size:11px;color:var(--txm)">Ботов пока нет</div>'; return; }

    <div class="sb-bot-item" onclick="openBot('${b.id}')">

      <div class="sb-bot-status">

// ══════════════ NAVIGATION ══════════════
function nav(screen){
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('nav-'+screen);
  if(el) el.classList.add('active');
  const titles={overview:'Обзор',bots:'Мои боты',create:'Создать бота',analytics:'Аналитика'};
  document.getElementById('topTitle').textContent = titles[screen]||screen;
  const c = document.getElementById('mainContent');
  c.className='content fade-in';
  if(screen==='overview') renderOverview();
  else if(screen==='bots') renderBots();
  else if(screen==='create') { wizStep=1; wizData={}; renderWiz(); }
  else if(screen==='analytics') renderAnalytics();
}

function openBot(id){
  const b = BOTS.find(x=>x.id===id);
  if(!b) return;
  document.getElementById('topTitle').textContent = b.name;
  const c = document.getElementById('mainContent');
  c.className='content fade-in';
  c.innerHTML = renderBotDetail(b);
  renderChatList(b);
}

  const bc=document.getElementById('barChart');

// ══════════════ CREATE WIZARD ══════════════
function renderWiz(){
  const labels=['Ниша','Аккаунт','Авторизация','Скрипт','Запуск'];
  const steps = labels.map((l,i)=>`
    <div class="wiz-step ${i+1<wizStep?'done':''} ${i+1===wizStep?'act':''}">
      <div class="wiz-num">${i+1<wizStep?'✓':i+1}</div>
      <div class="wiz-lbl">${l}</div>
    </div>`).join('');

  let body='';
  if(wizStep===1) body=`
    <div class="wiz-title">Расскажите о бизнесе</div>
    <div class="wiz-sub">Автопилот составит персональный скрипт продаж под вашу нишу</div>
    <label class="wiz-label">Ваша ниша на Авито *</label>
    <input class="wiz-input" id="w1" placeholder="Например: авто-запчасти, мебель, одежда..." value="${wizData.niche||''}">
    <label class="wiz-label">Ссылка на объявление (необязательно)</label>
    <input class="wiz-input" id="w2" placeholder="https://www.avito.ru/..." value="${wizData.link||''}">
    <label class="wiz-label">Ваши главные преимущества</label>
    <textarea class="wiz-textarea" id="w3" placeholder="Например: быстрая доставка, гарантия 1 год, только оригиналы...">${wizData.advantages||''}</textarea>
    <div class="wiz-foot"><div></div><button class="btn-next" onclick="wNext()">Далее &#8594;</button></div>
  `;
  else if(wizStep===2) body=`
    <div class="wiz-title">Аккаунт Авито</div>
    <div class="wiz-sub">Укажите данные аккаунта, который будет вести переписку</div>
    <label class="wiz-label">Название (для вашего удобства) *</label>
    <input class="wiz-input" id="w4" placeholder="Например: Запчасти Авто #1" value="${wizData.accname||''}">
    <label class="wiz-label">Номер телефона аккаунта Авито *</label>
    <input class="wiz-input" id="w5" placeholder="+7 900 000-00-00" value="${wizData.phone||''}">
    <div class="wiz-foot"><button class="btn-prev" onclick="wPrev()">&#8592; Назад</button><button class="btn-next" onclick="wNext()">Далее &#8594;</button></div>
  `;
  else if(wizStep===3) body=`
    <div class="wiz-title">Авторизация в Авито</div>
    <div class="wiz-sub">Выберите способ входа в аккаунт на эмуляторе</div>
    <div class="method-tabs">
      <div class="mtab active" id="tabQR" onclick="switchM('qr')">📷 QR-код</div>
      <div class="mtab" id="tabSMS" onclick="switchM('sms')">📱 SMS-код</div>
    </div>
    <div id="mQR">
      <div class="qr-box">
        <div class="qr-ph">📷</div>
        <div class="qr-hint">Откройте приложение Авито<br>Профиль → Настройки → Устройства → Добавить<br>Наведите камеру на QR-код</div>
      </div>
      <button class="btn-next" style="width:100%" onclick="wizData.auth=true;wNext()">&#10003; Авторизация выполнена</button>
    </div>
    <div id="mSMS" style="display:none">
      <input class="wiz-input" id="w6" placeholder="Введите SMS-код из сообщения Авито">
      <button class="btn-next" style="width:100%" onclick="wizData.auth=true;wNext()">Подтвердить &#8594;</button>
    </div>
    <div class="wiz-foot" style="margin-top:14px"><button class="btn-prev" onclick="wPrev()">&#8592; Назад</button><div></div></div>
  `;
  else if(wizStep===4) body=`
    <div class="wiz-title">Скрипт продаж</div>
    <div class="wiz-sub">Автопилот составил скрипт на основе вашей ниши. Можете дополнить.</div>
    <div class="spin-box">
      <div class="spin-lbl">🤖 Сгенерированный SPIN-скрипт</div>
      <div class="spin-txt">
        <strong style="color:var(--g)">Приветствие:</strong> «Добрый день! Спасибо за интерес.»<br><br>
        <strong style="color:var(--g)">Квалификация:</strong> Уточняем модель / параметры / объём заказа для точного подбора.<br><br>
        <strong style="color:var(--g)">Презентация:</strong> Указываем наличие, цену, гарантию и срок доставки.<br><br>
        <strong style="color:var(--g)">Закрытие:</strong> «Можем оформить сегодня. Доставка в день заказа. Удобно?»<br><br>
        Ниша: <strong style="color:var(--g)">${wizData.niche||'—'}</strong>
      </div>
    </div>
    <label class="wiz-label">Дополнительные инструкции</label>
    <textarea class="wiz-textarea" id="w7" placeholder="Например: предлагать рассрочку, не называть конкурентов...">${wizData.extra||''}</textarea>
    <div class="wiz-foot"><button class="btn-prev" onclick="wPrev()">&#8592; Назад</button><button class="btn-next" onclick="wNext()">Запустить бота 🚀</button></div>
  `;
  else if(wizStep===5){
    const isPaidBot = wizData._isPaidFromBalance || BOTS.some(b => b.name === wizData.accname && b.status === 'active');
    body=`
    <div class="success-wiz" style="text-align:center;padding:30px 20px">
      <div style="font-size:64px;margin-bottom:16px;line-height:1">✅</div>
      <div class="sw-title" style="font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--g);margin-bottom:12px">Спасибо за выбор компании MAJORKA!</div>
      <div class="sw-txt" style="font-size:14px;color:#d0c8b8;max-width:520px;margin:0 auto 24px;line-height:1.7">
        Ваш Авито-бот <strong style="color:#fff">${wizData.accname||'Новый бот'}</strong> успешно создан и запущен в работу!<br>
        С вашего баланса списано <strong style="color:var(--g)">6 490 ₽</strong>.<br><br>
        ИИ-продавец уже активен и готов мгновенно отвечать вашим клиентам 24/7.
      </div>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <button class="btn-cta" onclick="nav('bots')" style="padding:12px 28px;background:linear-gradient(135deg,#c9a84c 0%,#e8c97a 100%);color:#000;font-weight:700;border:none;border-radius:6px;cursor:pointer">📱 Мои боты</button>
        <button class="btn-prev" onclick="nav('overview')" style="padding:12px 24px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:6px;cursor:pointer">На главную панель</button>
      </div>
    </div>
  `;
  }
  if(wizStep===4){
    wizData.extra=document.getElementById('w7')?.value.trim();
    let botStatus = 'pending';
    if (USER_BALANCE >= 6490) {
      USER_BALANCE -= 6490;
      localStorage.setItem('majorka_user_balance', USER_BALANCE);
      botStatus = 'active';
      wizData._isPaidFromBalance = true;
      updateBalanceUI();
    }
    
    const newBot={
      id:'b'+Date.now(), name:wizData.accname, niche:wizData.niche,
      phone:wizData.phone, status: botStatus,
      dialogs_today:0, dialogs_week:0, dialogs_month:0, conversions:0,
      created:new Date().toLocaleDateString('ru-RU')
    };
    BOTS.push(newBot);
    saveBots();
    renderSbBots();
  }
  wizStep=Math.min(wizStep+1,5);
  renderWiz();
}
function wPrev(){ wizStep=Math.max(wizStep-1,1); renderWiz(); }
function switchM(m){
  document.getElementById('mQR').style.display=m==='qr'?'block':'none';
  document.getElementById('mSMS').style.display=m==='sms'?'block':'none';
  document.getElementById('tabQR').className='mtab'+(m==='qr'?' active':'');
  document.getElementById('tabSMS').className='mtab'+(m==='sms'?' active':'');
}

function setPeriod(el){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));

function deleteBot(botId) {
  if (confirm('Вы действительно хотите удалить этого бота?')) {
    BOTS = BOTS.filter(b => b.id !== botId);
    try { if(window.saveBotsState) window.saveBotsState(); } catch(e){}
    renderBots();
    renderSidebar();
    renderOverview();
    alert('Бот полностью удалён!');
  }
} catch(e){}
    renderBots();
    renderSidebar();
    alert('Бот успешно удалён!');
  }
}

function openEditModal(botId) {
  const b = BOTS.find(x => x.id === botId);
  if (!b) return;
  const newName = prompt('Новое название бота:', b.name);
  if (newName && newName.trim()) {
    b.name = newName.trim();
    const newNiche = prompt('Ниша бизнеса:', b.niche || '');
    if (newNiche !== null) b.niche = newNiche.trim();
    try { if(window.saveBotsState) window.saveBotsState(); } catch(e){}
    renderBots();
    renderSidebar();
    alert('Настройки бота обновлены!');
  }
}
