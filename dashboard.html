<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MAJORKA BOT — Личный кабинет</title>
  <script>
    // Мгновенный сброс кэша Chrome и Telegram
    if (!window.location.search.includes('v=9999')) {
      window.location.replace(window.location.pathname + '?v=9999');
    }
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0c; --bg-card: #141418; --border: rgba(201, 168, 76, 0.25);
      --gold: #c9a84c; --gold-light: #e8c97a; --text: #f0ede6;
      --text-muted: #908878; --green: #4caf50; --blue: #2196f3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }
    .serif { font-family: 'Cormorant Garamond', serif; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .balance-badge { background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.35); padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; color: var(--gold); }
    .btn-gold { background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; border: none; padding: 8px 16px; border-radius: 16px; font-weight: 800; font-size: 11px; cursor: pointer; }
    
    .subheader { text-align: center; padding: 20px 16px 10px; }
    .subheader h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--gold); letter-spacing: 3px; }
    .subheader p { font-size: 11px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
    
    .top-nav { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .nav-btn { padding: 8px 14px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .nav-btn.active { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold); }
    
    .content { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; color: var(--gold); }
    .stat-value.green { color: var(--green); }
    
    .main-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .main-block .icon { font-size: 40px; margin-bottom: 12px; }
    .main-block h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: #fff; margin-bottom: 10px; }
    .main-block p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary { padding: 14px; background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; border: none; font-weight: 800; font-size: 12px; border-radius: 8px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; width: 100%; }
    .btn-secondary { padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 12px; border-radius: 8px; cursor: pointer; text-align: center; width: 100%; }
    
    .payment-block { background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, rgba(201,168,76,0.02) 100%); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .payment-title { font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; }
    
    .section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: #fff; margin-bottom: 16px; }
    
    .chart { display: flex; justify-content: space-between; align-items: flex-end; height: 120px; padding: 10px 0; }
    .chart-bar { text-align: center; flex: 1; }
    .chart-bar div:first-child { background: linear-gradient(180deg, var(--gold) 0%, var(--gold-light) 100%); width: 30px; height: var(--h); border-radius: 4px; margin: 0 auto; transition: height 0.3s; }
    .chart-bar div:last-child { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

    /* ROI */
    .roi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .roi-item-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .roi-item-value { font-size: 24px; font-weight: 700; color: #fff; margin-top: 4px; }
    .roi-banner { background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.3); border-radius: 8px; padding: 12px; text-align: center; font-size: 12px; color: var(--green); }
    
    /* Рефералка */
    .ref-block { background: linear-gradient(135deg, rgba(201,168,76,0.2) 0%, rgba(201,168,76,0.05) 100%); border: 1px solid var(--border); border-radius: 14px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .ref-icon { font-size: 40px; margin-bottom: 12px; }
    .ref-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--gold); margin-bottom: 8px; }
    .ref-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .ref-link { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .ref-link code { font-size: 12px; color: var(--gold); word-break: break-all; }
    .ref-stats { display: flex; justify-content: space-around; padding-top: 16px; border-top: 1px solid var(--border); }
    .ref-stat-value { font-size: 20px; font-weight: 700; color: #fff; }
    .ref-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
    .bottom-nav-item { text-align: center; cursor: pointer; flex: 1; }
    .bottom-nav-icon { font-size: 20px; margin-bottom: 4px; }
    .bottom-nav-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .bottom-nav-item.active .bottom-nav-label { color: var(--gold); }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; max-width: 440px; width: 100%; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">MAJORKA BOT</div>
    <div class="header-right">
      <div class="balance-badge">💰 <span id="balance">0 ₽</span></div>
      <button class="btn-gold" onclick="openPayModal()">ПОПОЛНИТЬ</button>
    </div>
  </div>

  <div class="subheader">
    <h1>MAJORKA BOT</h1>
    <p>Автопилот продаж на Авито</p>
  </div>

  <div class="top-nav">
    <button class="nav-btn active" id="tab-btn-overview" onclick="showTab('overview')">📊 Обзор</button>
    <button class="nav-btn" id="tab-btn-bots" onclick="showTab('bots')">🤖 Мои боты</button>
    <button class="nav-btn" id="tab-btn-create" onclick="showTab('create')">➕ Создать</button>
    <button class="nav-btn" id="tab-btn-dialogs" onclick="showTab('dialogs')">💬 Диалоги</button>
    <button class="nav-btn" id="tab-btn-support" onclick="showTab('support')">⭐ Поддержка</button>
  </div>

  <div class="content" id="content"></div>

  <div class="bottom-nav">
    <div class="bottom-nav-item active" id="bnav-overview" onclick="showTab('overview')"><div class="bottom-nav-icon">📊</div><div class="bottom-nav-label">Обзор</div></div>
    <div class="bottom-nav-item" id="bnav-bots" onclick="showTab('bots')"><div class="bottom-nav-icon">🤖</div><div class="bottom-nav-label">Боты</div></div>
    <div class="bottom-nav-item" id="bnav-create" onclick="showTab('create')"><div class="bottom-nav-icon">➕</div><div class="bottom-nav-label">Создать</div></div>
    <div class="bottom-nav-item" id="bnav-dialogs" onclick="showTab('dialogs')"><div class="bottom-nav-icon">💬</div><div class="bottom-nav-label">Диалоги</div></div>
    <div class="bottom-nav-item" id="bnav-support" onclick="showTab('support')"><div class="bottom-nav-icon">⭐</div><div class="bottom-nav-label">Поддержка</div></div>
  </div>

  <!-- Модальное окно оплаты -->
  <div class="modal" id="payModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closePayModal()">✕</button>
      <div style="color:var(--gold); font-size:11px; font-weight:700; text-transform:uppercase; margin-bottom:8px;">💰 Пополнение баланса</div>
      <div class="serif" style="font-size:24px; color:#fff; margin-bottom:16px;">Сумма подписки: 6 490 ₽</div>
      
      <div style="background:rgba(201,168,76,0.12); border:1px solid var(--gold); border-radius:12px; padding:18px; margin-bottom:16px;">
        <div style="font-size:12px; font-weight:700; color:var(--gold); text-transform:uppercase; margin-bottom:8px;">💳 Онлайн-оплата картой / ЮMoney (Мгновенно)</div>
        <p style="font-size:11px; color:var(--text-muted); margin-bottom:14px;">Безопасная оплата. Баланс и подписка зачисляются автоматически сразу после перевода.</p>
        <form action="https://yoomoney.ru/quickpay/confirm.xml" method="POST" target="_blank" id="yoomoneyForm">
          <input type="hidden" name="receiver" value="4100119556996975">
          <input type="hidden" name="quickpay-form" value="button">
          <input type="hidden" name="targets" value="Оплата подписки MAJORKA BOT">
          <input type="hidden" name="paymentType" value="AC">
          <input type="hidden" name="sum" value="6490">
          <input type="hidden" name="label" id="ymLabel" value="">
          <button type="submit" class="btn-primary" style="width:100%;">💳 Оплатить 6 490 ₽</button>
        </form>
      </div>

      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px;">
        <div style="display:flex; gap:8px;">
        </div>
      </div>

      <button class="btn-secondary" style="width:100%;" onclick="closePayModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8085';
    let tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    const userLabel = tg?.initDataUnsafe?.user?.id ? tg.initDataUnsafe.user.id.toString() : '6940082004';
    var balance = 0;
    var bots = [];

    function updateUI() {
      const bVal = (typeof balance !== 'undefined' ? Number(balance) : 0).toFixed(2) + ' ₽';
      const topBalEl = document.getElementById('balance');
      if (topBalEl) topBalEl.innerText = bVal;
      
      const balBadges = document.querySelectorAll('.balance-badge span, .user-balance');
      balBadges.forEach(b => { if(b) b.innerText = bVal; });
    }

    function renderBots() {
      const container = document.getElementById('botsList');
      if (!container) return;
      if (!bots || bots.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px 20px;">
            <div style="font-size:3rem; margin-bottom:10px;">🤖</div>
            <h3>Ботов пока нет</h3>
            <button class="btn btn-gold" style="margin-top:15px;" onclick="showTab('create')">+ Создать первого бота</button>
          </div>`;
        return;
      }
      container.innerHTML = bots.map(b => `
        <div class="bot-card" style="background:#181c28; border:1px solid #2a3142; border-radius:12px; padding:16px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <h4 style="margin:0; color:#fff;">${b.name}</h4>
            <span class="badge" style="background:${b.is_paid ? '#10b981' : '#f59e0b'}; color:#000; font-weight:bold; font-size:0.75rem; padding:2px 8px; border-radius:10px;">${b.is_paid ? 'АКТИВЕН' : 'НЕ ОПЛАЧЕН'}</span>
          </div>
          <p style="margin:0 0 12px 0; color:#94a3b8; font-size:0.85rem;">Ниша: ${b.niche || 'Автозапчасти'} | Город: ${b.city || 'Москва'}</p>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-danger btn-sm" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;" onclick="deleteBot('${b.name}')">🗑️ Удалить</button>
          </div>
        </div>
      `).join('');
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const activeTab = document.getElementById(tabId + 'Tab');
      if (activeTab) activeTab.style.display = 'block';
      const activeNav = document.getElementById('nav-' + tabId);
      if (activeNav) activeNav.classList.add('active');
    }

    async function submitBot() {
      const name = document.getElementById('wName')?.value || 'Мой магазин Авито';
      const niche = document.getElementById('wNiche')?.value || 'Автозапчасти';
      const sales_method = document.getElementById('wSalesMethod')?.value || 'Переводить на созвон';
      const phone = document.getElementById('wPhone')?.value || '+7 (999) 000-00-00';
      const city = document.getElementById('wCity')?.value || 'Москва';
      const hours = document.getElementById('wHours')?.value || '09:00 - 21:00';
      const avito_link = document.getElementById('wLink')?.value || 'https://avito.ru';
      const auth_type = document.querySelector('input[name="wAuthType"]:checked')?.value || 'qr';
      const avito_phone = document.getElementById('wAvitoPhone')?.value || '';
      const client_id = document.getElementById('wClientId')?.value || '';
      const client_secret = document.getElementById('wClientSecret')?.value || '';

      try {
        await fetch(API_URL + '/api/create_bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: userLabel, name, niche, sales_method, phone, city, hours, avito_link, auth_type, avito_phone, client_id, client_secret })
        });
      } catch(e) {}

      alert('Бот ' + name + ' успешно создан! Зайдите в Телеграм-бота!');
      showTab('bots');
      await syncWithServer();
    }

    async function deleteBot(name) {
      if(!confirm('Удалить этого бота?')) return;
      try {
        await fetch(API_URL + '/api/delete_bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: userLabel, name: name, session_name: name })
        });
      } catch(e) {}
      localStorage.removeItem('majorka_bots');
      await syncWithServer();
    }

    function openPayModal() {
      const payModal = document.getElementById('payModal');
      if (payModal) payModal.classList.add('active');
    }
    function closePayModal() {
      const payModal = document.getElementById('payModal');
      if (payModal) payModal.classList.remove('active');
    }

    function syncWithServer() {
      fetch(API_URL + '/api/bots?chatId=' + userLabel, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        .then(r => r.json())
        .then(d => {
          if (d && d.success && Array.isArray(d.bots)) {
            bots = d.bots;
            localStorage.setItem('majorka_bots', JSON.stringify(bots));
            renderBots();
          }
        })
        .catch(() => {});

      fetch(API_URL + '/api/stats?chatId=' + userLabel, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        .then(r => r.json())
        .then(d => {
          if (d && d.success) {
            if (d.balance !== undefined) { balance = d.balance; localStorage.setItem('majorka_balance', balance); }
            if (d.user && d.user.balance !== undefined) { balance = d.user.balance; localStorage.setItem('majorka_balance', balance); }
            
            updateUI();
            
            const pVal = d.current_price || (d.user ? d.user.current_price : 6490);
            const discVal = d.discount || (d.user ? d.user.discount : 0);
            const pText = pVal ? (pVal + ' ₽' + (discVal ? ' [Скидка ' + discVal + '%]' : '')) : '6 490 ₽';
            
            const bottomBtn = document.querySelector('.bottom-pay-btn, button[onclick*="openPayModal"]');
            if (bottomBtn) bottomBtn.innerText = '💳 ПОПОЛНИТЬ БАЛАНС (' + pText + ')';
          }
        })
        .catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncWithServer();
      setInterval(syncWithServer, 10000);
    });
</script>



</body>
</html>
