<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJORKA BOT — Личный Кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0a0a0c;
      --bg-card: #141418;
      --border: rgba(201, 168, 76, 0.25);
      --g: #c9a84c;
      --g-light: #e8c97a;
      --tx: #f0ede6;
      --txm: #908878;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--tx); min-height: 100vh; overflow-x: hidden; }

    .app { display: flex; min-height: 100vh; position: relative; }
    
    /* SIDEBAR */
    .sidebar { 
      width: 250px; 
      background: #0d0d10; 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      padding: 20px 0; 
      flex-shrink: 0;
      transition: transform 0.3s ease;
      z-index: 999;
    }
    
    .sb-brand { padding: 0 20px 20px; font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--g); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sb-menu { padding: 16px 0; flex: 1; }
    .sb-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--txm); font-size: 13px; font-weight: 500; cursor: pointer; border-left: 3px solid transparent; }
    .sb-item:hover, .sb-item.active { background: rgba(201,168,76,0.1); color: #fff; border-left-color: var(--g); }

    /* MAIN CONTENT AREA */
    .main { flex: 1; display: flex; flex-direction: column; width: 100%; min-width: 0; }
    
    /* TOPBAR */
    .topbar { height: 65px; padding: 0 20px; background: #0d0d10; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .menu-toggle { display: none; background: none; border: none; color: var(--g); font-size: 24px; cursor: pointer; }
    .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: #fff; }
    
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .balance-badge { font-size: 11px; font-weight: 700; background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.35); padding: 6px 14px; border-radius: 16px; color: #fff; white-space: nowrap; }
    .btn-topup { padding: 8px 16px; border-radius: 16px; background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; font-weight: 800; font-size: 11px; cursor: pointer; border: none; white-space: nowrap; }

    /* CONTENT BODY */
    .content { padding: 24px; flex: 1; }
    
    /* CARDS */
    .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }
    .card-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--txm); margin-bottom: 6px; }
    .card-val { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 700; color: var(--g); }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); width: 240px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); }
      .sidebar.open { transform: translateX(0); }
      .content { padding: 16px; }
      .topbar { padding: 0 12px; }
      .topbar-title { font-size: 18px; }
      .balance-badge { font-size: 10px; padding: 5px 10px; }
      .btn-topup { font-size: 10px; padding: 6px 12px; }
    }

    /* MODAL */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #141418; border: 1px solid var(--border); border-radius: 16px; max-width: 440px; width: 100%; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }
    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; border: none; font-weight: 800; font-size: 12px; text-transform: uppercase; border-radius: 8px; cursor: pointer; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 600; color: var(--txm); margin-bottom: 6px; text-transform: uppercase; }
    .form-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
  </style>
</head>
<body>

  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sb-brand">MAJORKA BOT</div>
      <div class="sb-menu">
        <div class="sb-item active" id="nav-overview" onclick="nav('overview')">
          <span>📊</span> Обзор
        </div>
        <div class="sb-item" id="nav-bots" onclick="nav('bots')">
          <span>🤖</span> Мои боты
        </div>
        <div class="sb-item" id="nav-create" onclick="nav('create')">
          <span>➕</span> Создать бота
        </div>
        <div class="sb-item" onclick="window.location.href='index.html'">
          <span>🌐</span> Главный сайт
        </div>
      </div>
      <div style="padding: 0 20px; font-size: 11px; color: var(--txm);">
        Поддержка: @chc332
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <div class="topbar-title" id="topTitle">Обзор</div>
        </div>
        <div class="topbar-right">
          <div class="balance-badge">💰 <span id="balVal" style="color:var(--g)">0 ₽</span></div>
          <button class="btn-topup" onclick="openPayModal()">💳 ПОПОЛНИТЬ 6 490 ₽</button>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content" id="mainContent">
        <!-- RENDERED BY JS -->
      </div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div class="modal-bg" id="payModal" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="closePayModal()">✕</button>
      <div style="color:var(--g);font-size:11px;font-weight:700;margin-bottom:8px;text-transform:uppercase">💰 Пополнение баланса</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#fff;margin-bottom:4px">Пополнение на 6 490 ₽</div>
      <div style="font-size:11px;color:var(--txm);margin-bottom:20px">Хватает для запуска 1 Авито-бота на 1 месяц</div>

      <div style="background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px">
        <div style="font-size:10px;font-weight:700;color:var(--g);text-transform:uppercase;margin-bottom:8px">⚡ Перевод по СБП (0% комиссии):</div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px">
          <span style="color:var(--txm)">Номер СБП:</span>
          <strong style="color:#fff">+7 (923) 451-10-89</strong>
        </div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px">
          <span style="color:var(--txm)">Банк:</span>
          <strong style="color:#ffe082">🟡 Т-Банк (Тинькофф)</strong>
        </div>
      </div>

      <button type="button" onclick="confirmTopup()" class="btn-primary" style="margin-bottom:10px">✅ Я перевёл (Подтвердить 6 490 ₽)</button>
      
      <form action="https://yoomoney.ru/quickpay/confirm.xml" method="POST" target="_blank" onsubmit="setTimeout(confirmTopup, 1000)">
        <input type="hidden" name="receiver" value="4100119556996975">
        <input type="hidden" name="quickpay-form" value="shop">
        <input type="hidden" name="targets" value="Пополнение баланса MAJORKA BOT">
        <input type="hidden" name="paymentType" value="AC">
        <input type="hidden" name="sum" value="6490">
        <button type="submit" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px;font-size:11px;border-radius:6px;cursor:pointer">💳 Оплатить картой через ЮMoney</button>
      </form>
    </div>
  </div>

  <script>
    let USER_BALANCE = parseInt(localStorage.getItem('majorka_user_balance') || '0');
    let BOTS = JSON.parse(localStorage.getItem('majorka_bots') || '[]');

    function updateBalanceUI() {
      const el = document.getElementById('balVal');
      if (el) el.textContent = USER_BALANCE.toLocaleString('ru-RU') + ' ₽';
    }

    function saveState() {
      localStorage.setItem('majorka_user_balance', USER_BALANCE.toString());
      localStorage.setItem('majorka_bots', JSON.stringify(BOTS));
      updateBalanceUI();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function nav(screen) {
      document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('active'));
      const activeNav = document.getElementById('nav-' + screen);
      if (activeNav) activeNav.classList.add('active');
      document.getElementById('sidebar').classList.remove('open');

      if (screen === 'overview') renderOverview();
      else if (screen === 'bots') renderBots();
      else if (screen === 'create') renderCreateWiz();
    }

    function renderOverview() {
      document.getElementById('topTitle').textContent = 'Обзор';
      const activeBots = BOTS.filter(b => b.status === 'active').length;

      document.getElementById('mainContent').innerHTML = 
        '<div class="cards-row">' +
          '<div class="card">' +
            '<div class="card-lbl">Всего ботов</div>' +
            '<div class="card-val">' + BOTS.length + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="card-lbl">Активных ботов</div>' +
            '<div class="card-val">' + activeBots + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="card-lbl">Баланс</div>' +
            '<div class="card-val">' + USER_BALANCE.toLocaleString('ru-RU') + ' ₽</div>' +
          '</div>' +
        '</div>' +
        '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center">' +
          '<h3 style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#fff;margin-bottom:10px">Панель управления MAJORKA BOT</h3>' +
          '<p style="font-size:13px;color:var(--txm);max-width:480px;margin:0 auto 20px">Создавайте ботов, следите за статусом и пополняйте баланс для автоматизации продаж на Авито.</p>' +
          '<button onclick="nav('create')" class="btn-topup" style="padding:10px 24px">➕ Создать бота</button>' +
        '</div>';
    }

    function renderBots() {
      document.getElementById('topTitle').textContent = 'Мои боты';
      const container = document.getElementById('mainContent');

      if (BOTS.length === 0) {
        container.innerHTML = 
          '<div style="text-align:center;padding:48px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px">' +
            '<div style="font-size:40px;margin-bottom:12px">🤖</div>' +
            '<h3 style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;margin-bottom:8px">Ботов пока нет</h3>' +
            '<p style="font-size:12px;color:var(--txm);margin-bottom:20px">Создайте вашего первого авто-продавца</p>' +
            '<button onclick="nav('create')" class="btn-topup" style="padding:10px 24px">➕ Создать бота</button>' +
          '</div>';
        return;
      }

      container.innerHTML = 
        '<div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:16px">' +
          BOTS.map(function(b) {
            return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px">' +
              '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">' +
                '<div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:#fff;font-weight:600">' + b.name + '</div>' +
                '<div style="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(67,160,71,0.15);color:#81c784">АКТИВЕН</div>' +
              '</div>' +
              '<div style="font-size:11px;color:var(--txm);margin-bottom:16px">Ниша: ' + (b.niche || 'Авито') + '</div>' +
              '<button onclick="deleteBot('' + b.id + '')" style="background:rgba(229,57,53,0.15);border:1px solid rgba(229,57,53,0.3);color:#ef5350;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer">🗑️ Удалить бота</button>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    function renderCreateWiz() {
      document.getElementById('topTitle').textContent = 'Создание бота';
      document.getElementById('mainContent').innerHTML = 
        '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:520px;margin:0 auto">' +
          '<h2 style="font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;margin-bottom:6px">Новый Авито-бот</h2>' +
          '<p style="font-size:12px;color:var(--txm);margin-bottom:20px">Укажите параметры подключения</p>' +
          '<div class="form-group">' +
            '<label class="form-label">Название бота / Аккаунта</label>' +
            '<input type="text" id="wName" class="form-input" placeholder="Мой магазин Авито">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Ваша Ниша / Товар</label>' +
            '<input type="text" id="wNiche" class="form-input" placeholder="Автозапчасти, Электроника">' +
          '</div>' +
          '<button onclick="submitWiz()" class="btn-primary">Запустить бота 🚀</button>' +
        '</div>';
    }

    function submitWiz() {
      const name = document.getElementById('wName').value.trim() || 'Новый бот';
      const niche = document.getElementById('wNiche').value.trim() || 'Товары';

      if (USER_BALANCE < 6490) {
        openPayModal();
        alert('Для запуска бота пополните баланс на 6 490 ₽.');
        return;
      }

      USER_BALANCE -= 6490;
      BOTS.push({
        id: 'bot_' + Date.now(),
        name: name,
        niche: niche,
        status: 'active',
        created: new Date().toLocaleDateString('ru-RU')
      });

      saveState();

      document.getElementById('mainContent').innerHTML = 
        '<div style="text-align:center;padding:36px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px">' +
          '<div style="font-size:56px;margin-bottom:12px">✅</div>' +
          '<h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--g);margin-bottom:10px">Спасибо за выбор компании MAJORKA!</h2>' +
          '<p style="font-size:13px;color:var(--tx);max-width:440px;margin:0 auto 20px;line-height:1.5">' +
            'Ваш Авито-бот <strong>"' + name + '"</strong> запущен в работу!<br>' +
            'Списано с баланса: <strong style="color:var(--g)">6 490 ₽</strong>.' +
          '</p>' +
          '<button onclick="nav('bots')" class="btn-topup" style="padding:10px 24px">📱 Перейти к ботам</button>' +
        '</div>';
    }

    function deleteBot(id) {
      if (confirm('Вы действительно хотите удалить этого бота?')) {
        BOTS = BOTS.filter(function(b) { return b.id !== id; });
        saveState();
        renderBots();
      }
    }

    function openPayModal() {
      document.getElementById('payModal').style.display = 'flex';
    }

    function closePayModal() {
      document.getElementById('payModal').style.display = 'none';
    }

    function confirmTopup() {
      USER_BALANCE += 6490;
      saveState();
      closePayModal();
      alert('🎉 Баланс пополнен на 6 490 ₽! Теперь вы можете запустить бота.');
    }

    // Direct initialization
    updateBalanceUI();
    renderOverview();
  </script>
</body>
</html>
