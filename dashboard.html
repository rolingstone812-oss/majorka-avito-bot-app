<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAJORKA BOT — Личный Кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #0a0a0c;
      --bg-card: #121215;
      --border: rgba(201, 168, 76, 0.2);
      --g: #c9a84c;
      --g-light: #e8c97a;
      --tx: #f0ede6;
      --txm: #908878;
      --red: #e53935;
      --green: #43a047;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--tx); min-height: 100vh; overflow-x: hidden; }

    /* LAYOUT */
    .app { display: flex; min-height: 100vh; }
    
    /* SIDEBAR */
    .sidebar { width: 260px; background: #0f0f12; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; flex-shrink: 0; }
    .sb-brand { padding: 0 24px 24px; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--g); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sb-menu { padding: 24px 0; flex: 1; }
    .sb-item { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--txm); font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; }
    .sb-item:hover, .sb-item.active { background: rgba(201,168,76,0.08); color: #fff; border-left-color: var(--g); }
    .sb-item-icon { font-size: 16px; }

    /* MAIN CONTENT */
    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    
    /* TOPBAR */
    .topbar { height: 70px; padding: 0 32px; background: #0f0f12; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: #fff; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .balance-badge { font-size: 13px; font-weight: 700; background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.35); padding: 8px 18px; border-radius: 20px; color: #fff; }
    .btn-topup { padding: 9px 24px; border-radius: 20px; background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; font-weight: 800; font-size: 12px; cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(201,168,76,0.3); transition: 0.2s; }
    .btn-topup:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(201,168,76,0.5); }

    /* CONTENT BODY */
    .content { padding: 32px; flex: 1; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* CARDS */
    .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 14px; }
    .card-lbl { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--txm); margin-bottom: 8px; }
    .card-val { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 700; color: var(--g); }

    /* BOTS GRID */
    .bots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .bot-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; position: relative; }
    .bot-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .bot-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #fff; font-weight: 600; }
    .bot-status { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 12px; }
    .bot-status.active { background: rgba(67,160,71,0.15); color: #81c784; border: 1px solid rgba(67,160,71,0.3); }

    /* MODAL */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #141417; border: 1px solid var(--border); border-radius: 18px; max-width: 480px; width: 100%; padding: 32px; position: relative; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #888; font-size: 22px; cursor: pointer; }

    /* WIZARD */
    .wiz-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--txm); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input { width: 100%; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--g); }
    .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #c9a84c 0%, #e8c97a 100%); color: #000; border: none; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app" id="mainApp">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-brand">MAJORKA BOT</div>
      <div class="sb-menu">
        <div class="sb-item active" id="nav-overview" onclick="nav('overview')">
          <span class="sb-item-icon">📊</span> Обзор
        </div>
        <div class="sb-item" id="nav-bots" onclick="nav('bots')">
          <span class="sb-item-icon">🤖</span> Мои боты
        </div>
        <div class="sb-item" id="nav-create" onclick="nav('create')">
          <span class="sb-item-icon">➕</span> Создать бота
        </div>
      </div>
      <div style="padding: 0 24px; font-size: 11px; color: var(--txm);">
        Поддержка: @chc332
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- TOPBAR -->
      <div class="topbar">
        <div class="topbar-title" id="topTitle">Обзор</div>
        <div class="topbar-right">
          <div class="balance-badge" id="uBalanceDisplay">💰 БАЛАНС: <span style="color:var(--g)" id="balVal">0 ₽</span></div>
          <button class="btn-topup" onclick="openPaymentModal()">💳 ПОПОЛНИТЬ 6 490 ₽</button>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content fade-in" id="mainContent">
        <!-- RENDERED BY JS -->
      </div>
    </div>
  </div>

  <!-- PAYMENT MODAL -->
  <div class="modal-bg" id="payModal" style="display:none">
    <div class="modal-box">
      <button class="modal-close" onclick="closePaymentModal()">✕</button>
      <div style="display:inline-block;background:rgba(201,168,76,0.15);color:#c9a84c;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;margin-bottom:12px">💰 Пополнение баланса</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:28px;color:#fff;margin-bottom:6px">Пополнение на 6 490 ₽</div>
      <div style="font-size:12px;color:var(--txm);margin-bottom:24px">Хватает для запуска 1 Авито-бота на 1 месяц</div>

      <!-- SBP DIRECT TRANSFER -->
      <div style="background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px">
        <div style="font-size:11px;font-weight:700;color:var(--g);text-transform:uppercase;margin-bottom:12px">⚡ Перевод по СБП (0% комиссии):</div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px">
          <span style="color:var(--txm)">Номер СБП:</span>
          <strong style="color:#fff">+7 (923) 451-10-89</strong>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px">
          <span style="color:var(--txm)">Банк получателя:</span>
          <strong style="color:#ffe082">🟡 Т-Банк (Тинькофф)</strong>
        </div>
      </div>

      <button type="button" onclick="confirmTopup()" class="btn-primary" style="margin-bottom:12px">✅ Я перевёл (Подтвердить 6 490 ₽)</button>
      
      <form action="https://yoomoney.ru/quickpay/confirm.xml" method="POST" target="_blank" onsubmit="setTimeout(confirmTopup, 1000)">
        <input type="hidden" name="receiver" value="4100119556996975">
        <input type="hidden" name="quickpay-form" value="shop">
        <input type="hidden" name="targets" value="Пополнение баланса MAJORKA BOT">
        <input type="hidden" name="paymentType" value="AC">
        <input type="hidden" name="sum" value="6490">
        <button type="submit" style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:12px;font-size:12px;border-radius:8px;cursor:pointer">💳 Оплатить картой через ЮMoney</button>
      </form>
    </div>
  </div>

  <script>
    // --- USER & BOT ENGINE ---
    let USER_BALANCE = parseInt(localStorage.getItem('majorka_user_balance') || '0');
    let BOTS = JSON.parse(localStorage.getItem('majorka_bots') || '[]');

    function updateBalanceUI() {
      document.getElementById('balVal').textContent = USER_BALANCE.toLocaleString('ru-RU') + ' ₽';
    }

    function saveState() {
      localStorage.setItem('majorka_user_balance', USER_BALANCE);
      localStorage.setItem('majorka_bots', JSON.stringify(BOTS));
      updateBalanceUI();
    }

    function nav(screen) {
      document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('active'));
      const activeNav = document.getElementById('nav-' + screen);
      if(activeNav) activeNav.classList.add('active');

      const content = document.getElementById('mainContent');
      if (screen === 'overview') renderOverview();
      else if (screen === 'bots') renderBots();
      else if (screen === 'create') renderCreateWiz();
    }

    function renderOverview() {
      document.getElementById('topTitle').textContent = 'Обзор';
      const activeBots = BOTS.filter(b => b.status === 'active').length;

      document.getElementById('mainContent').innerHTML = `
        <div class="cards-row">
          <div class="card">
            <div class="card-lbl">Всего ботов</div>
            <div class="card-val">\${BOTS.length}</div>
          </div>
          <div class="card">
            <div class="card-lbl">Активных ботов</div>
            <div class="card-val">\${activeBots}</div>
          </div>
          <div class="card">
            <div class="card-lbl">Баланс</div>
            <div class="card-val">\${USER_BALANCE.toLocaleString('ru-RU')} ₽</div>
          </div>
        </div>

        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:32px;text-align:center">
          <h3 style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#fff;margin-bottom:12px">Добро пожаловать в MAJORKA BOT</h3>
          <p style="font-size:13px;color:var(--txm);max-width:500px;margin:0 auto 24px">Создавайте и запускайте авто-продавцов для Авито прямо из личного кабинета.</p>
          <button onclick="nav('create')" class="btn-topup" style="padding:12px 32px">➕ Создать нового бота</button>
        </div>
      `;
    }

    function renderBots() {
      document.getElementById('topTitle').textContent = 'Мои боты';
      const container = document.getElementById('mainContent');

      if (BOTS.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:60px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px">
            <div style="font-size:48px;margin-bottom:16px">🤖</div>
            <h3 style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#fff;margin-bottom:8px">Ботов пока нет</h3>
            <p style="font-size:13px;color:var(--txm);margin-bottom:24px">Создайте своего первого авто-продавца</p>
            <button onclick="nav('create')" class="btn-topup" style="padding:12px 28px">➕ Создать бота</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="bots-grid">
          \${BOTS.map(b => `
            <div class="bot-card">
              <div class="bot-head">
                <div class="bot-title">\${b.name}</div>
                <div class="bot-status active">АКТИВЕН</div>
              </div>
              <div style="font-size:12px;color:var(--txm);margin-bottom:16px">Ниша: \${b.niche || 'Авито'}</div>
              <button onclick="deleteBot('\${b.id}')" style="background:rgba(229,57,53,0.15);border:1px solid rgba(229,57,53,0.3);color:#ef5350;padding:8px 16px;border-radius:6px;font-size:11px;cursor:pointer">🗑️ Удалить бота</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    let wizData = {};
    function renderCreateWiz() {
      document.getElementById('topTitle').textContent = 'Создание бота';
      document.getElementById('mainContent').innerHTML = `
        <div class="wiz-box">
          <h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;color:#fff;margin-bottom:8px">Новый Авито-бот</h2>
          <p style="font-size:12px;color:var(--txm);margin-bottom:24px">Заполните параметры для подключения бота</p>

          <div class="form-group">
            <label class="form-label">Название бота / Аккаунта</label>
            <input type="text" id="wName" class="form-input" placeholder="Например: Мой магазин Авито">
          </div>

          <div class="form-group">
            <label class="form-label">Ваша Ниша / Товар</label>
            <input type="text" id="wNiche" class="form-input" placeholder="Например: Автозапчасти, Строительство">
          </div>

          <button onclick="submitWiz()" class="btn-primary">Запустить бота 🚀</button>
        </div>
      `;
    }

    function submitWiz() {
      const name = document.getElementById('wName').value.trim() || 'Новый бот';
      const niche = document.getElementById('wNiche').value.trim() || 'Товары';

      if (USER_BALANCE < 6490) {
        openPaymentModal();
        alert('Для запуска бота необходимо пополнить баланс на 6 490 ₽.');
        return;
      }

      USER_BALANCE -= 6490;
      const newBot = {
        id: 'bot_' + Date.now(),
        name: name,
        niche: niche,
        status: 'active',
        created: new Date().toLocaleDateString('ru-RU')
      };

      BOTS.push(newBot);
      saveState();

      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center;padding:40px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px">
          <div style="font-size:64px;margin-bottom:16px">✅</div>
          <h2 style="font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--g);margin-bottom:12px">Спасибо за выбор компании MAJORKA!</h2>
          <p style="font-size:14px;color:var(--tx);max-width:500px;margin:0 auto 24px;line-height:1.6">
            Ваш Авито-бот <strong>"\${name}"</strong> успешно создан и запущен в работу!<br>
            Списано с баланса: <strong style="color:var(--g)">6 490 ₽</strong>.
          </p>
          <button onclick="nav('bots')" class="btn-topup" style="padding:12px 32px">📱 Перейти к ботам</button>
        </div>
      `;
    }

    function deleteBot(id) {
      if (confirm('Вы действительно хотите удалить этого бота?')) {
        BOTS = BOTS.filter(b => b.id !== id);
        saveState();
        renderBots();
      }
    }

    function openPaymentModal() {
      document.getElementById('payModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('payModal').style.display = 'none';
    }

    function confirmTopup() {
      USER_BALANCE += 6490;
      saveState();
      closePaymentModal();
      alert('🎉 Баланс пополнен на 6 490 ₽! Теперь вы можете запустить бота.');
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      updateBalanceUI();
      renderOverview();
    });
  </script>
</body>
</html>
